name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify release candidate
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Run offline acceptance paths
        run: |
          java -jar target/you-agent-cli.jar --demo
          java -jar target/you-agent-cli.jar --benchmark
      - name: Publish GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/you-agent-cli.jar --generate-notes --verify-tag
