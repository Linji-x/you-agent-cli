name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile, test, package, and report coverage
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Offline end-to-end demo
        run: java -jar target/you-agent-cli.jar --demo
      - name: Deterministic offline conformance benchmark
        run: java -jar target/you-agent-cli.jar --benchmark
      - name: Labeled code-retrieval evaluation
        run: java -jar target/you-agent-cli.jar --retrieval-eval
      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-java17
          path: target/site/jacoco/
          if-no-files-found: error
      - name: Basic secret-pattern gate
        shell: bash
        run: |
          if git grep -nE -- '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----|sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{20,}' -- ':!.env.example'; then
            echo 'Potential committed secret pattern detected.' >&2
            exit 1
          fi

  java21-compatibility:
    name: java21-compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify Java 21 runtime compatibility with Java 17 bytecode target
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Run shaded JAR on Java 21
        run: java -jar target/you-agent-cli.jar --demo

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
